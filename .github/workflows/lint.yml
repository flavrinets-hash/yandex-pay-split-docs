name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            README.md
            docs/**/*.md
      - name: Validate JSON examples
        run: |
          for f in examples/logs/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done
      - name: Link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress
            --accept 200..=299,403,429
            --exclude example\.com
            --exclude pay\.ya\.ru/o/
            --exclude img\.shields\.io
            README.md 'docs/**/*.md' examples/README.md
